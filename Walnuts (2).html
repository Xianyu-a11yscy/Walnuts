<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#C9242B"/>
<title>Walnuts-字卡传讯</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23FFB6C1'/><stop offset='100%25' stop-color='%23C71585'/></linearGradient><filter id='glow'><feGaussianBlur stdDeviation='2' result='blur'/><feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs><rect width='100' height='100' rx='22' fill='%23FFE4E1'/><circle cx='50' cy='50' r='38' fill='url(%23g)' filter='url(%23glow)' opacity='0.8'/><rect x='25' y='35' width='50' height='30' rx='6' fill='%23fff' opacity='0.9'/><rect x='32' y='42' width='36' height='4' rx='2' fill='%23FF69B4'/><rect x='32' y='50' width='28' height='4' rx='2' fill='%23FF69B4'/><circle cx='50' cy='62' r='4' fill='%23FF69B4'/></svg>">
<style>
:root{
  --accent:#C9242B;
  --accent-soft:rgba(201,36,43,.10);
  --accent-mid:rgba(201,36,43,.30);
  --accent-dark:#A81C22;
  --bg:#F4F4F6;
  --card:#FFFFFF;
  --text:#1A1A1C;
  --muted:#8A8A90;
  --line:#ECECEF;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}

.app{max-width:540px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:78px;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.2px;}
.brand-mark{
  width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-dark));
  color:#fff;font-size:14px;font-weight:900;
  box-shadow:0 4px 12px -3px var(--accent-mid);
}
.brand-sub{color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:0;}
.page{display:none;animation:fade .28s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:540px;height:64px;z-index:60;
  background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#A0A0A6;font-size:11px;font-weight:600;transition:.2s;}
.tab .ti{font-size:19px;line-height:1;filter:grayscale(1) opacity(.55);transition:.2s;}
.tab.active{color:var(--accent);}
.tab.active .ti{filter:none;transform:translateY(-1px) scale(1.06);}

.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:12px;box-shadow:0 2px 14px -8px rgba(0,0,0,.14);}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.ch-title{font-size:14px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:6px;}
.ch-title::before{content:'';width:4px;height:14px;border-radius:3px;background:var(--accent);}
.ch-btn{font-size:12px;color:var(--accent);font-weight:700;background:var(--accent-soft);padding:5px 12px;border-radius:20px;}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0;}

.hero{
  margin:12px;border-radius:24px;padding:18px 16px 16px;
  background:linear-gradient(150deg,var(--accent) 0%,var(--accent-dark) 100%);
  color:#fff;position:relative;overflow:hidden;
  box-shadow:0 14px 34px -16px var(--accent-mid);
}
.hero::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.10);top:-110px;right:-60px;}
.hero::before{content:'';position:absolute;width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.07);bottom:-70px;left:-40px;}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:2;}
.avatar{
  width:50px;height:50px;border-radius:50%;flex:0 0 auto;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;
}
.avatar.me{background-color:#9E9EA6;}
.avatar.dream{background-color:rgba(255,255,255,.28);}
.hero-mid{flex:1;min-width:0;}
.hero-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hero-title .hh{font-size:12px;opacity:.85;}
.hero-link{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;opacity:.95;flex-wrap:wrap;}
.hero-link .ll{opacity:.8;}
.hero-link .stars{letter-spacing:1px;color:#FFE9A8;font-size:12px;}
.hero-link .lvl{background:rgba(255,255,255,.22);padding:1px 8px;border-radius:20px;font-weight:700;}
.clock-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;position:relative;z-index:2;}
.clock-card{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 11px;backdrop-filter:blur(4px);}
.ck-label{font-size:10.5px;opacity:.82;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ck-time{font-size:20px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums;}
.ck-date{font-size:10.5px;opacity:.86;margin-top:2px;}
.ck-weather{font-size:11px;margin-top:5px;background:rgba(255,255,255,.2);display:inline-block;padding:2px 8px;border-radius:20px;}

.dream-switch{
  display:flex;gap:12px;padding:6px 16px 10px;margin:0 12px;
  overflow-x:auto;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.dream-switch::-webkit-scrollbar{display:none;}
.ds-item{
  flex:0 0 auto;width:60px;display:flex;flex-direction:column;align-items:center;gap:5px;
  position:relative;transition:.18s;
}
.ds-item:active{transform:scale(.94);}
.ds-avatar{
  width:52px;height:52px;border-radius:50%;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;
  background-color:#B5B5BC;position:relative;
  border:2.5px solid transparent;
  transition:.18s;
}
.ds-item.active .ds-avatar{
  border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
  transform:scale(1.04);
}
.ds-item .ds-dream-av{background-color:var(--accent);}
.ds-name{
  font-size:11.5px;font-weight:700;color:var(--muted);
  max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;
}
.ds-item.active .ds-name{color:var(--accent);}
.ds-badge{
  position:absolute;top:-2px;right:2px;min-width:18px;height:18px;
  background:#FF3B30;color:#fff;font-size:10.5px;font-weight:800;
  border-radius:9px;padding:0 5px;display:grid;place-items:center;
  border:2px solid #fff;line-height:1;
}
.ds-add .ds-avatar{background-color:#fff;color:var(--accent);border:2px dashed var(--accent);font-size:24px;font-weight:400;}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px;}
.quick-item{
  background:#fff;border-radius:16px;padding:14px 4px 11px;display:flex;flex-direction:column;
  align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text);
  box-shadow:0 2px 14px -8px rgba(0,0,0,.16);transition:.18s;position:relative;overflow:hidden;
}
.quick-item:active{transform:scale(.95);}
.quick-item .qi{font-size:21px;line-height:1;}
.quick-item::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:3px 3px 0 0;background:var(--accent);opacity:.85;}

.status-card{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(120deg,#fff 40%,var(--accent-soft));}
.sc-left{display:flex;align-items:center;gap:10px;min-width:0;}
.dot{width:9px;height:9px;border-radius:50%;background:#37C46A;box-shadow:0 0 0 4px rgba(55,196,106,.18);flex:0 0 auto;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(55,196,106,.18)}50%{box-shadow:0 0 0 8px rgba(55,196,106,.06)}}
.sc-title{font-size:13.5px;font-weight:800;}
.sc-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.sc-emoji{font-size:26px;}

.ann-body{text-align:center;padding:8px 0 4px;}
.ann-days{font-size:36px;font-weight:900;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums;}
.ann-days small{font-size:14px;font-weight:700;margin-left:3px;}
.ann-text{font-size:13px;color:var(--muted);margin-top:8px;font-weight:600;}

.word-card{background:linear-gradient(150deg,#fff 30%,var(--accent-soft));}
.word-text{font-size:15px;line-height:1.75;font-weight:700;color:var(--text);letter-spacing:.3px;}
.word-text::before{content:'“';color:var(--accent);font-size:22px;font-weight:900;margin-right:2px;}
.word-text::after{content:'”';color:var(--accent);font-size:22px;font-weight:900;margin-left:2px;}

.mood-line{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line);}
.mood-line:last-child{border-bottom:none;}
.mood-line .mdate{color:var(--muted);font-size:11.5px;width:74px;flex:0 0 auto;}
.mood-line .memo{font-size:16px;}
.mood-line .mtext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tag-me{font-size:10px;background:var(--accent);color:#fff;padding:1px 7px;border-radius:20px;font-weight:700;}
.tag-dream{font-size:10px;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:20px;font-weight:700;}

.fullscreen{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;flex-direction:column;max-width:540px;margin:0 auto;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.22,.9,.3,1);
}
.fullscreen.show{transform:none;}
.page-head{
  display:flex;align-items:center;gap:8px;padding:12px 12px;
  background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.page-head .back{font-size:26px;line-height:1;width:34px;height:34px;border-radius:50%;color:var(--text);display:grid;place-items:center;}
.page-head .back:active{background:#F0F0F2;}
.ph-title{flex:1;text-align:center;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;}
.ph-btn{width:36px;height:34px;border-radius:10px;font-size:16px;color:var(--muted);}
.online{width:7px;height:7px;border-radius:50%;background:#37C46A;display:inline-block;}

.chat-body{flex:1;overflow-y:auto;padding:16px 14px 20px;display:flex;flex-direction:column;gap:14px;}
.chat-empty{margin:auto;color:var(--muted);font-size:13.5px;text-align:center;line-height:2;}
.msg-row{display:flex;gap:9px;align-items:flex-end;}
.msg-row.mine{flex-direction:row-reverse;}
.msg-av{width:38px;height:38px;border-radius:50%;background-size:cover;background-position:center;flex:0 0 auto;
  display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;background-color:#B5B5BC;}
.msg-av.dream{background-color:var(--accent);}
.bubble-wrap{max-width:74%;display:flex;flex-direction:column;gap:4px;}
.msg-row.mine .bubble-wrap{align-items:flex-end;}
.bubble{
  padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.6;word-break:break-word;
  background:#fff;box-shadow:0 2px 10px -7px rgba(0,0,0,.3);border-bottom-left-radius:5px;
}
.msg-row.mine .bubble{background:linear-gradient(140deg,var(--accent),var(--accent-dark));color:#fff;border-bottom-left-radius:16px;border-bottom-right-radius:5px;}
.quote{
  font-size:11.5px;color:var(--muted);background:rgba(0,0,0,.045);padding:6px 10px;border-radius:10px;
  border-left:3px solid var(--accent);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sticker-msg{max-width:130px;border-radius:12px;display:block;}
.msg-time{font-size:10px;color:#B4B4BA;padding:0 3px;}
.chat-input{
  display:flex;align-items:center;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid var(--line);flex:0 0 auto;
}
.chat-input input{flex:1;border:none;outline:none;background:#F2F2F5;border-radius:20px;padding:10px 14px;font-size:14.5px;}
.ci-btn{width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--muted);display:grid;place-items:center;}
.ci-send{background:linear-gradient(140deg,var(--accent),var(--accent-dark));color:#fff;font-weight:800;font-size:13.5px;padding:9px 17px;border-radius:20px;}
.ci-send:active{transform:scale(.94);}
.emoji-panel{display:none;background:#fff;border-top:1px solid var(--line);max-height:230px;overflow-y:auto;padding:10px;flex:0 0 auto;}
.emoji-panel.show{display:block;}
.emoji-tabs{display:flex;gap:8px;margin-bottom:10px;}
.emoji-tab{font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px;background:#F2F2F5;color:var(--muted);}
.emoji-tab.active{background:var(--accent);color:#fff;}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
.emoji-grid span{font-size:21px;text-align:center;padding:5px 0;border-radius:9px;cursor:pointer;}
.emoji-grid span:active{background:#F2F2F5;}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.sticker-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#F2F2F5;}
.quote-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--accent-soft);font-size:12px;color:var(--accent);font-weight:600;}
.quote-bar .qx{margin-left:auto;font-size:15px;}

.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;outline:none;background:#FAFAFB;transition:.2s;}
.field:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft);}
textarea.field{resize:vertical;line-height:1.6;}
.btn{border-radius:12px;padding:11px 18px;font-size:14px;font-weight:800;background:#F2F2F5;color:var(--text);transition:.16s;}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(140deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 8px 18px -10px var(--accent-mid);}
.btn.block{width:100%;}
.btn.small{padding:7px 14px;font-size:12.5px;border-radius:10px;}
.row{display:flex;gap:10px;align-items:center;}

.mail-item{background:#fff;border-radius:16px;padding:14px;margin:10px 12px;box-shadow:0 2px 14px -9px rgba(0,0,0,.2);
  display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden;transition:.18s;}
.mail-item:active{transform:scale(.985);}
.mail-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.mail-icon{font-size:22px;line-height:1;}
.mail-main{flex:1;min-width:0;}
.mail-from{font-size:12.5px;font-weight:800;color:var(--accent);}
.mail-prev{font-size:13.5px;color:#4A4A50;margin-top:5px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.mail-time{font-size:10.5px;color:#B4B4BA;margin-top:6px;}
.letter-body{background:#fff;border-radius:16px;padding:20px;margin:12px;line-height:2;font-size:14.5px;white-space:pre-wrap;
  box-shadow:0 2px 14px -9px rgba(0,0,0,.2);}
.letter-sign{text-align:right;color:var(--accent);font-weight:800;font-size:13px;margin-top:14px;}

.me-header{margin:12px;background:linear-gradient(150deg,var(--accent),var(--accent-dark));border-radius:22px;padding:20px 16px;color:#fff;
  box-shadow:0 14px 32px -18px var(--accent-mid);}
.me-avs{display:flex;align-items:center;justify-content:center;gap:18px;}
.av-label{position:relative;display:block;}
.avatar.big{width:68px;height:68px;font-size:22px;border:3px solid rgba(255,255,255,.5);}
.av-edit{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--accent);
  font-size:12px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.me-heart{font-size:18px;opacity:.9;}
.av-input{display:none;}
.me-names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.name-input{width:100%;border:none;background:rgba(255,255,255,.2);border-radius:11px;padding:9px 12px;color:#fff;
  font-size:13.5px;font-weight:700;text-align:center;outline:none;}
.name-input::placeholder{color:rgba(255,255,255,.6);}
.group{background:#fff;border-radius:var(--radius);margin:12px;padding:16px;box-shadow:0 2px 14px -9px rgba(0,0,0,.2);}
.group-title{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.group-title::before{content:'';width:4px;height:14px;border-radius:3px;background:var(--accent);}
.g-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:13.5px;}
.g-row+.g-row{border-top:1px solid var(--line);}
input[type=color]{width:42px;height:30px;border:none;border-radius:9px;background:none;padding:0;cursor:pointer;}
.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
.chip-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;max-height:230px;overflow-y:auto;}
.chip{background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;padding:6px 10px;border-radius:20px;
  display:flex;align-items:center;gap:6px;max-width:100%;}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px;}
.chip i{font-style:normal;opacity:.6;font-size:14px;cursor:pointer;}
.sticker-manage{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px;}
.st-manage{position:relative;}
.st-manage img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;background:#F2F2F5;}
.st-manage i{position:absolute;top:-5px;right:-5px;width:20px;height:20px;background:var(--accent);color:#fff;border-radius:50%;
  font-style:normal;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.ann-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.ann-item:last-child{border-bottom:none;}
.ann-item .an-title{flex:1;font-weight:700;}
.ann-item .an-date{color:var(--muted);font-size:12px;}
.radio{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto;cursor:pointer;}
.radio.on{border-color:var(--accent);}
.radio.on::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent);}
.danger{color:#E5484D;}

.feed-post{background:#fff;border-radius:var(--radius);margin:12px;padding:14px;box-shadow:0 2px 14px -9px rgba(0,0,0,.2);}
.feed-post textarea{width:100%;border:none;outline:none;resize:none;font-size:14.5px;line-height:1.6;min-height:62px;background:transparent;}
.post-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px;}
.post-imgs .pimg{position:relative;}
.post-imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;}
.post-imgs .pimg i{position:absolute;top:-5px;right:-5px;width:20px;height:20px;background:rgba(0,0,0,.55);color:#fff;
  border-radius:50%;font-style:normal;font-size:12px;display:grid;place-items:center;}

/* ---------- 工具 ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const rand = a => a[Math.floor(Math.random()*a.length)];
const randInt = (a,b)=> a + Math.floor(Math.random()*(b-a+1));
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const firstChar = s => [...(s||'')][0] || '';
const clone = o => JSON.parse(JSON.stringify(o));

function fmtTime(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtFull(ts){const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function relTime(ts){
  const d = Date.now()-ts;
  if(d<60000) return '刚刚';
  if(d<3600000) return Math.floor(d/60000)+'分钟前';
  if(d<86400000) return Math.floor(d/3600000)+'小时前';
  const dt=new Date(ts);
  return `${dt.getMonth()+1}月${dt.getDate()}日 ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}
function seedFromDate(str){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function msToClock(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h>0?`${h}:${pad(m)}:${pad(ss)}`:`${pad(m)}:${pad(ss)}`;
}
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  return {r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)};
}
function shade(hex,p){
  const {r,g,b}=hexToRgb(hex);
  const f=(v)=>Math.max(0,Math.min(255,Math.round(v+(p<0?v*p:v*(255-v)*p))));
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function toast(msg,dur=2200){
  const el=document.createElement('div');

  setTimeout(()=>{el.style.transition='.3s';el.style.opacity='0';el.style.transform='translateY(-8px)';
    setTimeout(()=>el.remove(),300);},dur);
}
function compressImage(file,maxSize=900,quality=0.75,type='image/jpeg'){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        const ctx=c.getContext('2d');
        if(type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);}
        ctx.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL(type,quality));
      };
      img.onerror=()=>res(e.target.result);
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- IndexedDB ---------- */
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('walnutsDB',2);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    req.onsuccess=e=>res(e.target.result);
    req.onerror=()=>rej(e);
  });
}
function idbGet(k){
  return new Promise(res=>{
    try{const t=db.transaction('kv','readonly').objectStore('kv').get(k);
      t.onsuccess=()=>res(t.result);t.onerror=()=>res(null);}catch(e){res(null);}
  });
}
function idbSet(k,v){
  return new Promise(res=>{
    try{const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);
      t.onsuccess=()=>res();t.onerror=()=>res();}catch(e){res();}
  });
}

/* ---------- 默认数据 ---------- */
function newDreamObj(name){
  const id = 'd_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  return {
    id,
    name: name || '新梦角',

    dreamWorld: null,
    dreamStatus: null,
    lastProactive: 0,
    lastLetter: 0,
    lastDreamMoment: 0,
    musicIndex: 0

}

function defaultState(){
  const first = newDreamObj('梦角');
  return {
    me: {name:'我', avatar:''},
    theme: '#C9242B',
    dreams: [first],
    activeDreamId: first.id,
    myMoods: [],
    diary: [],
    moments: [],
    stickers: [],
    localWeather: null
  };
}

/* ---------- 迁移旧数据 ---------- */
function migrateState(saved){
  if(!saved) return defaultState();

  if(saved.dreams && Array.isArray(saved.dreams) && saved.dreams.length > 0 && saved.activeDreamId){
    const base = defaultState();
    base.me = saved.me || base.me;
    base.theme = saved.theme || base.theme;
    base.dreams = saved.dreams.map(d => {
      const nd = newDreamObj(d.name);
      Object.assign(nd, d);
      if(!nd.cards || !nd.cards.length) nd.cards = [...DEFAULT_CARDS];
      if(!nd.words || !nd.words.length) nd.words = [...DEFAULT_WORDS];
      if(!nd.link) nd.link = {level: 2, date:''};
      if(!nd.dailyWord) nd.dailyWord = {date:'',text:''};
      if(!nd.chats) nd.chats = [];
      if(!nd.letters) nd.letters = [];
      if(!nd.moods) nd.moods = [];
      if(!nd.playlist) nd.playlist = [];
      if(!nd.anniversaries) nd.anniversaries = [];
      return nd;
    });
    base.activeDreamId = base.dreams.find(x=>x.id===saved.activeDreamId) ? saved.activeDreamId : base.dreams[0].id;
    base.myMoods = saved.myMoods || [];
    base.diary = saved.diary || [];
    base.moments = saved.moments || [];
    base.stickers = saved.stickers || [];
    base.localWeather = saved.localWeather || null;
    return base;
  }

  if(saved.dream){
    const dreamId = 'd_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    const nd = newDreamObj(saved.dream.name || '梦角');
    nd.id = dreamId;
    nd.avatar = saved.dream.avatar || '';
    nd.cards = saved.cards && saved.cards.length ? saved.cards : [...DEFAULT_CARDS];
    nd.words = saved.words && saved.words.length ? saved.words : [...DEFAULT_WORDS];
    nd.dailyWord = saved.dailyWord || {date:'', text:''};
    nd.anniversaries = saved.anniversaries || [];
    nd.mainAnniversaryId = saved.mainAnniversaryId || null;
    nd.chats = (saved.chats || []).map(m => ({...m, read: true}));
    nd.letters = (saved.letters || []).map(l => ({...l, read: l.from==='me' ? true : !!l.read}));
    nd.moods = (saved.moods && saved.moods.dream) || [];
    nd.playlist = saved.playlist || [];
    nd.companion = saved.companion || null;
    nd.link = saved.link || {level: 2, date: ''};
    nd.dreamWorld = saved.dreamWorld || null;
    nd.dreamStatus = saved.dreamStatus || null;
    nd.lastProactive = saved.lastProactive || 0;
    nd.lastLetter = saved.lastLetter || 0;
    nd.lastDreamMoment = saved.lastDreamMoment || 0;
    nd.musicIndex = saved.musicIndex || 0;

    return {
      me: saved.me || {name:'我', avatar:''},
      theme: saved.theme || '#C9242B',
      dreams: [nd],
      activeDreamId: dreamId,
      myMoods: (saved.moods && saved.moods.me) || [],
      diary: saved.diary || [],
      moments: (saved.moments || []).map(m => ({
        ...m,
        from: m.from || 'me',
        dreamId: m.from === 'dream' ? dreamId : null
      })),
      stickers: saved.stickers || [],
      localWeather: saved.localWeather || null
    };
  }

  return defaultState();
}

/* ---------- 状态 ---------- */
let state=null;
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>idbSet('state',state),120);
}

function curDream(){
  if(!state || !state.dreams || !state.dreams.length) return null;
  return state.dreams.find(x=>x.id===state.activeDreamId) || state.dreams[0];
}
function findDream(id){
  if(!state || !state.dreams) return null;
  return state.dreams.find(x=>x.id===id) || null;
}
function dreamNameOf(d){ return d ? (d.name || '梦角') : '梦角'; }
const DN = () => dreamNameOf(curDream());

function unreadCount(d){
  if(!d) return 0;
  const c = (d.chats||[]).filter(m => m.from==='dream' && !m.read).length;
  const l = (d.letters||[]).filter(x => x.from==='dream' && !x.read).length;

function randomWeather(){
  const w=rand(WEATHER_POOL);
  return {desc:w.desc,emoji:w.emoji,temp:randInt(w.temp[0],w.temp[1])};
}
function initDreamWorldFor(d){
  if(d.dreamWorld) return;
  const offsetH=(Math.random()*24-12);
  d.dreamWorld={
    city:rand(DREAM_CITIES),
    offsetMs:Math.round(offsetH*2)/2*3600*1000,
    weather:randomWeather(),
    weatherSetAt:Date.now()
  };
}
function dreamWeatherOf(d){
  if(!d.dreamWorld) initDreamWorldFor(d);
  if(Date.now()-d.dreamWorld.weatherSetAt>3*3600*1000){
    d.dreamWorld.weather=randomWeather();
    d.dreamWorld.weatherSetAt=Date.now();
    save();
  }
  return d.dreamWorld.weather;
}

function ensureDailyFor(d){
  if(!d) return;
  const t=todayKey();
  if(!d.link || d.link.date!==t){
    d.link={level:randInt(0,4),date:t};
  }
  if(!d.dailyWord || d.dailyWord.date!==t){
    const pool=(d.words&&d.words.length)?d.words:DEFAULT_WORDS;
    d.dailyWord={date:t,text:pool[seedFromDate(t+d.id)%pool.length]};
  }
  if(!d.moods.some(m=>m.date===t)){
    const m=rand(DREAM_MOODS);
    d.moods.push({date:t,emoji:m.e,mood:m.t,auto:true});
  }
  if(!d.dreamStatus || Date.now()-(d.dreamStatus.at||0)>30*60000){
    const m=rand(DREAM_MOODS);
    d.dreamStatus={emoji:m.e,mood:m.t,at:Date.now()};
  }
}
function ensureAllDaily(){
  state.dreams.forEach(d=>{
    initDreamWorldFor(d);
    ensureDailyFor(d);
  });
  save();
}

function genCardTextFor(d,n){
  const pool=(d && d.cards && d.cards.length)?d.cards:DEFAULT_CARDS;
  const picks=[];
  for(let i=0;i<n;i++){
    let c=rand(pool),guard=0;
    while(picks.includes(c)&&pool.length>n&&guard++<24) c=rand(pool);
    picks.push(c);
  }
  return picks.join('，');
}

/* ---------- 本地天气 ---------- */
let geoBusy = false;

function fetchTimeout(url, ms = 4500, opt = {}) {
  return Promise.race([
    fetch(url, opt),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
  ]);
}

function paintLocalWeather() {
  const el = $('#myWeather');
  if (!el) return;
  if (state.localWeather) {
    el.textContent = `${state.localWeather.desc} ${state.localWeather.temp}℃`;
  } else {
    el.textContent = '获取中…';
  }
}

async function fetchWeatherByCoords(lat, lon) {
  try {
    const r = await fetchTimeout(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`,
      5000
    );
    const j = await r.json();
    const c = j.current;
    state.localWeather = {
      desc: WMO[c.weather_code] || '--',
      temp: Math.round(c.temperature_2m),
      at: Date.now()
    };
    save();
    paintLocalWeather();
    return true;
  } catch (e) {
    return false;
  }
}

async function fetchLocalWeather() {
  if (geoBusy) return;
  if (state.localWeather && Date.now() - (state.localWeather.at || 0) < 2 * 3600000) {
    paintLocalWeather();
    return;
  }
  geoBusy = true;
  paintLocalWeather();

  let ok = false;

  const ipApis = [
    { url: 'https://ipwho.is/',     pick: j => (j && j.success && j.latitude) ? { lat: j.latitude, lon: j.longitude } : null },
    { url: 'https://ipapi.co/json/', pick: j => (j && j.latitude) ? { lat: j.latitude, lon: j.longitude } : null },
    { url: 'https://ipinfo.io/json', pick: j => {
        if (!j || !j.loc) return null;
        const [la, lo] = j.loc.split(',').map(Number);
        return (isFinite(la) && isFinite(lo)) ? { lat: la, lon: lo } : null;
      } }
  ];
  for (const a of ipApis) {
    try {
      const r = await fetchTimeout(a.url, 4000, { cache: 'no-store' });
      const j = await r.json();
      const p = a.pick(j);
      if (p) {
        ok = await fetchWeatherByCoords(p.lat, p.lon);
        if (ok) break;
      }
    } catch (e) { }
  }

  if (!ok && navigator.geolocation) {
    await new Promise(res => {
      let done = false;
      const finish = () => { if (!done) { done = true; res(); } };
      navigator.geolocation.getCurrentPosition(
        async pos => {
          await fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude);
          finish();
        },
        () => finish(),
        { enableHighAccuracy: false, timeout: 6000, maximumAge: 1800000 }
      );
      setTimeout(finish, 7000);
    });
  }

  geoBusy = false;

  if (!state.localWeather) {
    const el = $('#myWeather');
    if (el) el.textContent = '--';
  } else {
    paintLocalWeather();
  }
}

/* ---------- 音频播放器 ---------- */
const audioEl=new Audio();
audioEl.preload='auto';
let audioFromDreamId = null;
audioEl.addEventListener('ended',()=>nextTrack());
audioEl.addEventListener('play',updateFloaters);
audioEl.addEventListener('pause',updateFloaters);

function playTrackFor(d, i){
  if(!d || !d.playlist.length) return;
  d.musicIndex=((i%d.playlist.length)+d.playlist.length)%d.playlist.length;
  const s=d.playlist[d.musicIndex];
  audioFromDreamId = d.id;
  audioEl.src=s.url;
  audioEl.play().catch(()=>toast('无法播放，请检查链接'));
  save();
  updateFloaters();
}
function nextTrack(){
  const d = audioFromDreamId ? findDream(audioFromDreamId) : curDream();
  if(!d || d.playlist.length<2) return;
  playTrackFor(d, d.musicIndex+1);
}
function togglePlay(){
  if(!audioEl.src){
    const d=curDream();
    if(d && d.playlist.length) playTrackFor(d, 0);
    return;
  }
  if(audioEl.paused) audioEl.play().catch(()=>{});
  else audioEl.pause();
  updateFloaters();
}

/* ---------- 悬浮窗 ---------- */
function updateFloaters(){
  const root=$('#floaterRoot');
  if(!root) return;

  const activeComps = state.dreams.filter(d => d.companion && d.companion.active);

  root.querySelectorAll('.floater[data-kind="comp"]').forEach(el=>{
    if(!activeComps.find(d => d.id === el.dataset.dream)) el.remove();
  });

  activeComps.forEach(d=>{
    let comp = root.querySelector(`.floater[data-kind="comp"][data-dream="${d.id}"]`);
    if(!comp){
      comp = document.createElement('div');
      comp.className='floater';
      comp.dataset.kind='comp';
      comp.dataset.dream=d.id;
      root.appendChild(comp);
    }
    const left=Math.max(0,d.companion.endAt-Date.now());
    comp.innerHTML=`
      <div>
        <div class="fl-time">${msToClock(left)}</div>
        <div class="fl-dream">${esc(d.name)}</div>
        <div class="fl-task">陪 ${esc(d.companion.task)}</div>
      </div>
      <button class="fl-x" data-fl="end">×</button>`;
    comp.querySelector('[data-fl="end"]').onclick=()=>endCompanionFor(d, false);
  });

  let au=$('#flAudio');
  if(audioEl.src){
    if(!au){
      au=document.createElement('div');
      au.id='flAudio';au.className='floater fl-audio';
      root.appendChild(au);
    }
    const d = audioFromDreamId ? findDream(audioFromDreamId) : null;
    const cur = (d && d.playlist[d.musicIndex]) || {name:'音频'};
    au.innerHTML=`
      <button data-fl="toggle">${audioEl.paused?'▶':'⏸'}</button>
      <div>
        <div class="fl-title">${esc(cur.name)}</div>
        <div class="fl-sub">${d?esc(d.name)+' · ':''}${audioEl.paused?'已暂停':'播放中…'}</div>
      </div>
      <button data-fl="next">⏭</button>
      <button data-fl="close">×</button>`;
    au.querySelector('[data-fl="toggle"]').onclick=togglePlay;
    au.querySelector('[data-fl="next"]').onclick=()=>nextTrack();
    au.querySelector('[data-fl="close"]').onclick=()=>{audioEl.pause();audioEl.src='';updateFloaters();};
  }else if(au){ au.remove(); }
}

function editDiary(exist,cb){
  const t=todayKey();
  const ov=document.createElement('div');
  ov.className='fullscreen';
  ov.innerHTML=`
    <header class="page-head">
      <button class="back" data-close>‹</button>
      <div class="ph-title">${exist?exist.date:'今天的日记'}</div>
      <div style="width:34px"></div>
    </header>
    <div style="flex:1;overflow-y:auto;padding:16px;">
      <textarea class="field" id="diaryText" rows="14" placeholder="今天发生了什么…">${exist?esc(exist.content):''}</textarea>
      <button class="btn primary block" id="saveDiary" style="margin-top:14px;">保存</button>
    </div>`;
  $('#overlayRoot').appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add('show'));
  ov.querySelector('[data-close]').onclick=()=>{ov.classList.remove('show');setTimeout(()=>ov.remove(),300);};
  $('#saveDiary').onclick=()=>{
    const text=$('#diaryText').value.trim();
    if(!text){toast('还没有写内容');return;}
    if(exist){ exist.content=text; }
    else{
      const rec={date:t,content:text,notes:[]};
      const idx=state.diary.findIndex(d=>d.date===t);
      if(idx>=0) state.diary[idx]=rec; else state.diary.push(rec);
    }
    save();
    const dreamCount = randInt(0, 2);
    const shuffled = [...state.dreams].sort(()=>Math.random()-0.5);
    for(let i=0;i<dreamCount && i<shuffled.length;i++){
      const dr = shuffled[i];
      const note = genCardTextFor(dr, randInt(1,2));
      const rec2 = state.diary.find(x=>x.date===t);
      if(rec2){
        rec2.notes = rec2.notes || [];
        rec2.notes.push({text:note, time:Date.now(), dreamId:dr.id});
      }
    }
    if(dreamCount>0) setTimeout(()=>toast('💌 有梦角在你日记里留言了'), 1000);
    save();
    ov.classList.remove('show');
    setTimeout(()=>{ov.remove();if(cb)cb();renderHome();},300);
    toast('日记已保存 📖');
  };
}

    const date=$('#annDate').value;

    const a={id:uid(),title,date};

    $('#annTitle').value='';$('#annDate').value='';
    renderAnnList();
    toast('已添加纪念日 🎉');
  };

    const el=$('#annList');
    if(!d.anniversaries.length){ el.innerHTML='<div class="empty">还没有纪念日</div>'; return; }
    el.innerHTML=d.anniversaries.map(a=>{
      const diff=dayDiff(a.date);
      const txt=diff>=0?`还有 ${diff} 天`:`已 ${-diff} 天`;
      return `<div class="ann-item">
        <div class="radio ${a.id===d.mainAnniversaryId?'on':''}" data-radio="${a.id}"></div>
        <div class="an-title">${esc(a.title)}</div>
        <div class="an-date">${a.date} · ${txt}</div>
        <i style="font-style:normal;color:#C4C4CA;font-size:16px;cursor:pointer;" data-del="${a.id}">×</i>
      </div>`;
    }).join('');
    el.querySelectorAll('[data-radio]').forEach(r=>{
      r.onclick=()=>{ d.mainAnniversaryId=r.dataset.radio; save(); renderAnnList(); };
    });
    el.querySelectorAll('[data-del]').forEach(x=>{
      x.onclick=()=>{
        d.anniversaries=d.anniversaries.filter(y=>y.id!==x.dataset.del);
        if(d.mainAnniversaryId===x.dataset.del) d.mainAnniversaryId=d.anniversaries[0]?.id||null;
        save();renderAnnList();
      };
    });
  }
}

function renderFeed(){
  const el=$('#page-feed');
  el.innerHTML=`
    <div class="feed-post">
      <textarea id="momentInput" placeholder="分享此刻…"></textarea>
      <div class="post-imgs" id="postImgs"></div>
      <div class="post-actions">
        <button class="pbtn" id="btnPickImg">🖼 图片</button>
        <button class="btn primary" id="btnPost" style="padding:8px 22px;font-size:13px;">发布</button>
      </div>
      <input type="file" accept="image/*" multiple id="momentFile" style="display:none">
    </div>
    <div id="momentList"></div>
    <div style="height:8px"></div>`;

  let pendingImgs=[];
  const fileInput=$('#momentFile');
  $('#btnPickImg').onclick=()=>fileInput.click();
  fileInput.onchange=async()=>{
    const files=[...fileInput.files].slice(0,9-pendingImgs.length);
    for(const f of files){
      const d=await compressImage(f,900,0.72);
      pendingImgs.push(d);
    }
    fileInput.value='';
    renderPostImgs();
  };
  function renderPostImgs(){
    const box=$('#postImgs');
    box.innerHTML=pendingImgs.map((d,i)=>`<div class="pimg"><img src="${d}"><i data-i="${i}">×</i></div>`).join('');
    box.querySelectorAll('[data-i]').forEach(x=>{
      x.onclick=()=>{pendingImgs.splice(+x.dataset.i,1);renderPostImgs();};
    });
  }
  $('#btnPost').onclick=()=>{
    const text=$('#momentInput').value.trim();
    if(!text&&!pendingImgs.length){toast('写点什么吧');return;}
    const m={id:uid(),from:'me',dreamId:null,text,images:[...pendingImgs],time:Date.now(),likes:[],comments:[]};
    state.moments.unshift(m);
    save();
    $('#momentInput').value='';
    pendingImgs=[];
    renderPostImgs();
    renderMoments();
    toast('已发布 ✨');
    const shuffled = [...state.dreams].sort(()=>Math.random()-0.5);
    const cnt = randInt(1, Math.min(2, shuffled.length));
    for(let i=0;i<cnt;i++){
      const dr = shuffled[i];
      const delay = randInt(8000,20000) + i*3000;
      setTimeout(()=>{
        if(Math.random()<0.85) m.likes.push(dr.name);
        if(Math.random()<0.65){
          m.comments.push({by:dr.name, dreamId:dr.id, text:genCardTextFor(dr, randInt(1,2)), time:Date.now()});
        }
        save();
        if($('#page-feed').classList.contains('active')) renderMoments();
        toast('🌠 '+dreamNameOf(dr)+' 互动了你的动态');
      }, delay);
    }
  };
  renderMoments();
}

function dreamPostMomentFor(d){
  if(!d) return;
  const cnt=randInt(1,3);
  const text=genCardTextFor(d,cnt);
  const m={
    id:uid(),
    from:'dream',
    dreamId: d.id,
    text,
    images:[],
    time:Date.now(),
    likes:[],
    comments:[]
  };
  state.moments.unshift(m);
  d.lastDreamMoment=Date.now();
  save();
  if($('#page-feed').classList.contains('active')) renderMoments();
  toast('🌠 '+dreamNameOf(d)+' 发了新动态');
}

function renderMoments(){
  const list=$('#momentList');
  if(!list) return;
  if(!state.moments.length){
    list.innerHTML='<div class="empty" style="padding:50px 0;">还没有动态，发布第一条吧 ✨</div>';
    return;
  }
  list.innerHTML=state.moments.map(m=>{
    const isDream = m.from === 'dream';
    const dream = isDream && m.dreamId ? findDream(m.dreamId) : null;
    const who = isDream ? (dream || {name:'梦角', avatar:''}) : state.me;
    const myLiked=m.likes.includes(state.me.name);
    return `<div class="moment" data-id="${m.id}">
      <div class="m-av ${isDream?'dream':''}" style="${who.avatar?`background-image:url('${who.avatar}')`:''}">${who.avatar?'':esc(firstChar(who.name))}</div>
      <div class="m-main">
        <div class="m-name ${isDream?'dream':''}">${esc(who.name)}</div>
        ${m.text?`<div class="m-text">${esc(m.text).replace(/\n/g,'<br>')}</div>`:''}
        ${m.images&&m.images.length?`<div class="m-imgs">${m.images.map(i=>`<img src="${i}">`).join('')}</div>`:''}
        <div class="m-foot">
          <span class="m-time">${relTime(m.time)}</span>
          <button class="m-act" data-act="like" data-id="${m.id}">${myLiked?'♥':'♡'} 赞</button>
          <button class="m-act" data-act="cmt" data-id="${m.id}">💬 评论</button>
        </div>
        ${m.likes.length?`<div class="m-likes">♥ ${m.likes.map(esc).join('，')}</div>`:''}
        ${m.comments.length?`<div class="m-comments">${m.comments.map(c=>{
          const isD = c.dreamId || state.dreams.find(x=>x.name===c.by);
          return `<div class="m-cmt"><b class="${isD?'dream':''}">${esc(c.by)}</b>：${esc(c.text)}</div>`;
        }).join('')}</div>`:''}
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick=()=>{
      const m=state.moments.find(x=>x.id===b.dataset.id);
      if(!m) return;
      if(b.dataset.act==='like'){
        const i=m.likes.indexOf(state.me.name);
        if(i>=0) m.likes.splice(i,1); else m.likes.push(state.me.name);
        save();renderMoments();
      }else{
        const txt=prompt('说点什么…');
        if(txt&&txt.trim()){
          m.comments.push({by:state.me.name,text:txt.trim(),time:Date.now()});
          save();renderMoments();
          const relatedDream = m.from==='dream' && m.dreamId ? findDream(m.dreamId) : curDream();
          if(relatedDream && Math.random()<0.7){
            setTimeout(()=>{
              m.comments.push({by:relatedDream.name, dreamId:relatedDream.id, text:genCardTextFor(relatedDream, randInt(1,2)), time:Date.now()});
              save();
              if($('#page-feed').classList.contains('active')) renderMoments();
            }, randInt(5000,12000));
          }
        }
      }
    };
  });
}

/* ============================================================

document.addEventListener('click', async e=>{
  const t=e.target;

  const tab=t.closest('.tab');
  if(tab){
    $$('.tab').forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    const name=tab.dataset.tab;
    $$('.page').forEach(p=>p.classList.remove('active'));
    $('#page-'+name).classList.add('active');
    if(name==='home') renderHome();
    if(name==='feed') renderMoments();
    if(name==='me') renderMe();
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }

  const dsItem = t.closest('.ds-item');
  if(dsItem && dsItem.dataset.dream){
    state.activeDreamId = dsItem.dataset.dream;
    save();
    renderHome();
    return;
  }

  const dc = t.closest('[data-edit]');
  if(dc){
    openDreamEdit(dc.dataset.edit);
    return;
  }

  const actEl=t.closest('[data-act]');
  const actName=actEl?actEl.dataset.act:null;

  if(actName==='chat'){ openChat(); return; }
  if(actName==='mail'){ openMailbox(); return; }
  if(actName==='company'){ openCompany(); return; }
  if(actName==='mood'){ openMood(); return; }
  if(actName==='diary'){ openDiary(); return; }
  if(actName==='annManage'){ openAnnManage(); return; }
  if(actName==='addDream'){ addDream(); return; }
  if(actName==='addSticker'){ $('#stickerFile').click(); return; }
  if(actName==='clearAll'){
    if(confirm('确定清空所有数据吗？此操作不可恢复。')){
      await idbSet('state',null);
      location.reload();
    }
    return;
  }
});

document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.classList && t.classList.contains('av-input') && !t.id){
    const f=t.files[0];
    if(!f) return;
    const av = await compressImage(f,400,0.8);
    if(t.dataset.av==='me'){
      state.me.avatar = av;
    }else{
      const d=curDream();
      if(d) d.avatar = av;
    }
    save();renderMe();renderHome();
    toast('头像已更新');
    return;
  }
  if(t.id==='stickerFile'){
    const files=[...t.files];
    for(const f of files){
      const d=await compressImage(f,320,0.85,'image/png');
      state.stickers.push(d);
    }
    t.value='';
    save();renderMe();
    toast('表情包已添加 🖼');
    return;
  }
});

      state.me.name = t.value.trim() || '我';
    }else{
      const d=curDream();
      if(d) d.name = t.value.trim() || '梦角';
    }
    save();
    renderHome();
    if($('#chatBody')) renderChat();
    return;
  }
  if(t.id==='themeColor'){
    state.theme=t.value;
    applyTheme(t.value);
    save();
  }
});

document.addEventListener('click', e=>{
  const sw=e.target.closest && e.target.closest('.swatch');
  if(sw){
    state.theme=sw.dataset.c;
    applyTheme(state.theme);
    save();
    const ci=$('#themeColor');
    if(ci) ci.value=state.theme;
  }
});

/* ============================================================
   后台循环
   ============================================================ */
function startLoops(){
  setInterval(()=>{
    if(document.hidden) return;
    if(!state) return;
    state.dreams.forEach(d=>{
      if(Date.now()-(d.lastProactive||0) < 90000) return;
      if(Math.random()<0.5){
        proactiveMessageFor(d);
      }
    });
  }, 90000);

  setInterval(()=>{
    if(document.hidden) return;
    state.dreams.forEach(d=>{
      if(Date.now()-(d.lastLetter||0) < 300000) return;
      if(Math.random()<0.14){
        incomingLetterFor(d);
      }
    });
  }, 180000);

  setInterval(()=>{
    if(document.hidden) return;
    state.dreams.forEach(d=>{
      if(Date.now()-(d.lastDreamMoment||0) < 180000) return;
      if(Math.random()<0.3){
        dreamPostMomentFor(d);
      }
    });
  }, 180000);

  setInterval(()=>{
    if(!audioEl.src || audioEl.paused) return;
    if(Math.random()<0.03){
      const d = audioFromDreamId ? findDream(audioFromDreamId) : curDream();
      toast('🎧 '+(d?d.name:'梦角')+' 帮你切了首歌');
      nextTrack();
    }
  }, 30000);
}

/* ============================================================
   启动
   ============================================================ */
(async function boot(){
  try{ db=await openDB(); }catch(e){}
  const saved = await idbGet('state');
  state = migrateState(saved);
  ensureAllDaily();
  applyTheme(state.theme);
  renderHome();
  renderFeed();
  renderMe();
  fetchLocalWeather();
  startLoops();
  tick();
  setInterval(tick, 1000);
  setInterval(fetchLocalWeather, 20*60000);

  const d = curDream();
  if(d && !d.chats.length){
    setTimeout(()=>{
      d.chats.push({id:uid(),from:'dream',text:genCardTextFor(d,2),time:Date.now(),read:false});
      save();
      if($('#page-home').classList.contains('active')) renderHome();
    }, 3000);
  }
})();
</script>
